name: Deploy Frontend — staging

on:
  push:
    branches: [staging]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker \
            ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push
        run: |
          IMAGE="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.AR_REPO }}/frontend"
          docker build \
            --build-arg NEXT_PUBLIC_MAPBOX_TOKEN=${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }} \
            --build-arg NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL_STAGING }} \
            -t "${IMAGE}:${{ github.sha }}" \
            -t "${IMAGE}:staging" .
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:staging"

      - name: Deploy to Cloud Run
        run: |
          IMAGE="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.AR_REPO }}/frontend"
          gcloud run deploy ${{ secrets.FRONTEND_SERVICE_NAME }} \
            --image "${IMAGE}:${{ github.sha }}" \
            --region ${{ secrets.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 5 \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --set-secrets "AUTH_SECRET=staging-auth-secret:latest" \
            --set-secrets "ONA_API_TOKEN=staging-ona-api-token:latest" \
            --set-secrets "GROQ_API_KEY=staging-groq-api-key:latest" \
            --set-env-vars "FASTAPI_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL_STAGING }}" \
            --set-env-vars "NODE_ENV=production"

      - name: Print service URL
        run: |
          URL=$(gcloud run services describe ${{ secrets.FRONTEND_SERVICE_NAME }} \
            --region ${{ secrets.GCP_REGION }} \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --format 'value(status.url)')
          echo "Frontend URL: $URL"
          echo "Set STAGING_FRONTEND_URL in backend repo GitHub secrets"
