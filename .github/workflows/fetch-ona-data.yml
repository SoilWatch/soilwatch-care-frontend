name: Fetch ONA Data

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure data directory exists
        run: mkdir -p data

      - name: Fetch biochar batch data (form 882350)
        env:
          ONA_TOKEN: ${{ secrets.ONA_API_TOKEN }}
        run: |
          curl -sL -H "Authorization: Token $ONA_TOKEN" \
            "https://api.ona.io/api/v1/data/882350.csv" \
            -o data/biochar_submissions.csv

      - name: Fetch regain kiln operator data (form 886121)
        env:
          ONA_TOKEN: ${{ secrets.ONA_API_TOKEN }}
        run: |
          curl -sL -H "Authorization: Token $ONA_TOKEN" \
            "https://api.ona.io/api/v1/data/886121.csv" \
            -o data/regain_submissions.csv

      - name: Fetch clearance site data
        env:
          ONA_TOKEN: ${{ secrets.ONA_API_TOKEN }}
          CLEARANCE_FORM_ID: ${{ secrets.ONA_CLEARANCE_FORM_ID }}
        run: |
          curl -sL -H "Authorization: Token $ONA_TOKEN" \
            "https://api.ona.io/api/v1/data/${CLEARANCE_FORM_ID}.json" \
            -o data/clearance_submissions.json

      - name: Fetch field trial data (form 891006)
        env:
          ONA_TOKEN: ${{ secrets.ONA_API_TOKEN }}
        run: |
          curl -sL -H "Authorization: Token $ONA_TOKEN" \
            "https://api.ona.io/api/v1/data/891006.json" \
            -o data/field_trial_submissions.json

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/biochar_submissions.csv data/regain_submissions.csv \
                  data/clearance_submissions.json data/field_trial_submissions.json
          git diff --staged --quiet || (git commit -m "chore: sync ONA data" && git push)
